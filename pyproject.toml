[project]
name = "agent-injection-evals"
version = "0.1.0"
description = "Offline prompt injection evaluation with simulated tool effects"
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["injection_evals"]
omit = ["injection_evals/model.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90
